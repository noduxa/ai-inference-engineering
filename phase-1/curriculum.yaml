modules:
  - id: M01
    number: 1
    title: Advanced Python for AI systems
    guide: modules/01-advanced-python.md
    source_pack: notebooklm/source-packs/01-advanced-python.md
    objectives:
      - Predict aliasing, lifetime and lazy-evaluation behaviour in short Python
        programs.
      - Build a tested package with typed boundaries and reliable cleanup.
      - Choose a concurrency mechanism from a workload description and measure
        its overhead.
      - Locate an allocation or CPU hotspot and trace a public repository call
        path.
    required_concepts:
      - Python’s object and memory model
      - References, identity, mutability and copying
      - Functions and closures
      - Decorators
      - Context managers
      - Iterators and generators
      - Type hints and protocols
      - Dataclasses
      - Error handling
      - Modules and packages
      - Virtual environments
      - Modern project packaging with pyproject.toml
      - Testing with pytest
      - Logging
      - AsyncIO
      - Threads
      - Multiprocessing
      - concurrent.futures
      - The Global Interpreter Lock (GIL), including version/build differences
      - CPU-bound versus I/O-bound workloads
      - Performance profiling
      - Memory profiling
      - Reading and navigating a large Python repository
    prerequisites: []
    source_ids:
      - py-runtime
      - py-tutorial
      - py-pytest
      - py-packaging
    exercises:
      - id: PY-01
        title: Generator versus list memory
        path: exercises/01-advanced-python.md
      - id: PY-02
        title: AsyncIO versus threads for I/O
        path: exercises/01-advanced-python.md
      - id: PY-03
        title: Multiprocessing for CPU-bound work
        path: exercises/01-advanced-python.md
      - id: PY-04
        title: Profile a slow function
        path: exercises/01-advanced-python.md
      - id: PY-05
        title: Trace memory allocations
        path: exercises/01-advanced-python.md
      - id: PY-06
        title: Package and read code
        path: exercises/01-advanced-python.md
