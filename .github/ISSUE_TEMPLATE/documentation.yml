name: Documentation improvement
description: Suggest an accurate, focused documentation change.
title: "[Documentation improvement] "
body:
  - type: markdown
    attributes:
      value:
        "Use public information only. Planned work is not completed evidence."
  - type: dropdown
    id: status
    attributes:
      label: Work status
      options:
        - Planned
        - Not started
        - In progress
        - To be validated
        - Completed with linked evidence
    validations:
      required: true
  - type: textarea
    id: location
    attributes:
      label: Document location
      description: "Link the affected file or section."
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed improvement
      description: "What is unclear, missing or inaccurate?"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Sources and verification
      description:
        "Link technical sources and describe how accuracy will be checked."
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy and accuracy
      options:
        - label:
            "I have excluded confidential, client, patient and private
            repository data, credentials, and internal hostnames or IP
            addresses. Claims and completion status are accurate."
          required: true
